name: Deploy Web to EAS

on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          # eas-cli is required by `npm run deploy:web` (`npx eas deploy`);
          # it is not a workspace dependency, so without this the deploy step
          # fails with "could not determine executable to run".
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        working-directory: mobile
        run: npm ci

      - name: ✅ Pre-deployment validation
        working-directory: mobile
        run: |
          echo "🔍 Running pre-deployment checks..."
          
          # Check for required environment variables
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ EXPO_TOKEN secret is not set"
            exit 1
          fi
          
          # Type check (if TypeScript is configured)
          if [ -f "tsconfig.json" ]; then
            echo "📝 Running TypeScript type check..."
            npx tsc --noEmit || {
              echo "❌ TypeScript type check failed"
              exit 1
            }
          fi
          
          # Verify package.json scripts exist
          if ! grep -q '"deploy:web"' package.json; then
            echo "❌ deploy:web script not found in package.json"
            exit 1
          fi
          
          echo "✅ Pre-deployment validation passed"

      - name: 🚀 Export and Deploy Web
        working-directory: mobile
        run: |
          # Fail fast if client env is missing: `expo export` inlines
          # EXPO_PUBLIC_* values at build time, so a bundle built without them
          # ships with undefined Supabase credentials and crashes on load
          # (this took production down after the first CI deploy — previous
          # deploys were manual from a machine with a local .env).
          # These values are public by design (they ship in every client
          # bundle); they live in the Production environment secrets.
          for var in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_API_URL; do
            if [ -z "${!var}" ]; then
              echo "❌ $var is not set — refusing to build a bundle with missing client env"
              exit 1
            fi
          done
          npm run deploy:web
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_URL: ${{ secrets.EXPO_PUBLIC_APP_URL }}
          EXPO_PUBLIC_DEFAULT_CURRENCY: ${{ secrets.EXPO_PUBLIC_DEFAULT_CURRENCY }}

      - name: 🏥 Post-deployment health check
        run: |
          echo "🏥 Running post-deployment health checks..."
          
          # Note: EAS deployment URL would need to be retrieved from deployment output
          # For now, we'll just verify the deployment completed successfully
          echo "✅ Deployment completed. Please verify the web app is accessible."
          echo ""
          echo "**Next steps:**"
          echo "1. Verify the web app loads correctly"
          echo "2. Test key user flows (auth, groups, transactions)"
          echo "3. Check browser console for any errors"
          
          # Add deployment summary
          echo "## ✅ Web Deployment Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The web application has been deployed to production via EAS." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Please verify:**" >> $GITHUB_STEP_SUMMARY
          echo "- Web app is accessible" >> $GITHUB_STEP_SUMMARY
          echo "- Authentication works correctly" >> $GITHUB_STEP_SUMMARY
          echo "- Layout respects max-width on desktop" >> $GITHUB_STEP_SUMMARY
          echo "- Modals are centered and properly sized" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
