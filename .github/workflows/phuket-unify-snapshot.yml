name: Phuket unify snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/phuket-unify-snapshot.yml"
      - "scripts/phuket_snapshot.py"
      - "scripts/compare-unified-settlement.ts"
      - "mobile/utils/currencyMerge.ts"
      - "mobile/utils/debt.ts"

permissions:
  contents: read

jobs:
  snapshot:
    name: Anonymized Phuket balances
    runs-on: ubuntu-latest
    environment: Production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Link ShareMoney project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p supabase/.temp
          printf '%s' "$SUPABASE_PROJECT_REF" > supabase/.temp/project-ref
          supabase --version
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes -p "$SUPABASE_DB_PASSWORD"; then
            echo "link with database password failed; continuing with project-ref for management queries"
          fi

      - name: Snapshot Phuket group
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SNAPSHOT_PATH: phuket-snapshot.json
        run: python3 scripts/phuket_snapshot.py

      - name: Compare old vs new settlement
        run: deno run --allow-read scripts/compare-unified-settlement.ts phuket-snapshot.json | tee phuket-compare.json

      - name: Write summary
        run: |
          {
            echo "## Phuket unified settlement snapshot"
            echo
            echo "Source: supabase db query. Anonymized first names only. No emails."
            echo
            echo '```json'
            cat phuket-compare.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: phuket-unify-snapshot
          path: |
            phuket-snapshot.json
            phuket-compare.json
          if-no-files-found: error
