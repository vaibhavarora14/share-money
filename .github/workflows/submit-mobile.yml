name: Submit Mobile Store Build

# Retry App Store / Play Store submission for an existing EAS build.
# Tag push is used because workflow_dispatch is forbidden for the automation token.
#
# Tags:
#   submit-ios-<eas-build-uuid>
#   submit-android-<eas-build-uuid>
#   submit-ios-latest
#   submit-android-latest
on:
  push:
    tags:
      - "submit-ios-*"
      - "submit-android-*"

concurrency:
  group: submit-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit:
    name: EAS submit
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        working-directory: mobile
        run: npm ci

      - name: 📤 Submit existing EAS build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            submit-ios-*)
              PLATFORM=ios
              TARGET="${TAG#submit-ios-}"
              ;;
            submit-android-*)
              PLATFORM=android
              TARGET="${TAG#submit-android-}"
              ;;
            *)
              echo "Unsupported tag: $TAG"
              exit 1
              ;;
          esac

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "❌ EXPO_TOKEN is not set"
            exit 1
          fi

          # Android must always enter Internal testing first. Production rollout
          # requires the explicit `store` EAS submit profile.
          if [ "$PLATFORM" = "android" ]; then
            SUBMIT_PROFILE=internal
          else
            SUBMIT_PROFILE=production
          fi

          ARGS=(--platform "$PLATFORM" --profile "$SUBMIT_PROFILE" --non-interactive --wait)
          if [ "$TARGET" = "latest" ]; then
            ARGS+=(--latest)
            echo "Submitting latest ${PLATFORM} build"
          else
            ARGS+=(--id "$TARGET")
            echo "Submitting ${PLATFORM} build ${TARGET}"
          fi

          eas submit "${ARGS[@]}"
          echo "✅ Submit finished for ${PLATFORM} (${TARGET}) using ${SUBMIT_PROFILE}"
