<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0; url=https://sharedmoney.app/app" />
    <link rel="canonical" href="https://sharedmoney.app/app" />
    <title>SharedMoney</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        max-width: 440px;
        text-align: center;
      }

      a {
        color: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Opening SharedMoney...</p>
      <p>
        <a id="continue-link" href="https://sharedmoney.app/app">
          Continue to SharedMoney
        </a>
      </p>
    </main>
    <script>
      const target = new URL("https://sharedmoney.app/app");
      const legacyPath = window.location.pathname.replace(/^\/+|\/+$/g, "");
      const appRelativePath = legacyPath.startsWith("app/")
        ? legacyPath.slice(4)
        : legacyPath;

      if (appRelativePath) {
        target.pathname = `/app/${appRelativePath}`;
      }

      target.search = window.location.search;
      target.hash = window.location.hash;
      document.getElementById("continue-link").href = target.href;
      window.location.replace(target.href);
    </script>
  </body>
</html>
