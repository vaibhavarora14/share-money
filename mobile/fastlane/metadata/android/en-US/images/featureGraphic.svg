<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-label="SharedMoney feature graphic">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#d9f99d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="126" cy="98" r="178" fill="#bfdbfe" opacity="0.55"/>
  <circle cx="902" cy="390" r="154" fill="#99f6e4" opacity="0.46"/>
  <circle cx="760" cy="84" r="56" fill="#ffffff" opacity="0.72"/>

  <rect x="120" y="95" width="720" height="310" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="120" y="95" width="10" height="310" rx="5" fill="url(#accent)"/>

  <image href="../../../../../assets/icon.png" xlink:href="../../../../../assets/icon.png" x="176" y="178" width="126" height="126" preserveAspectRatio="xMidYMid slice"/>

  <text x="342" y="202" fill="#111827" font-family="Inter, SF Pro Display, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="800">SharedMoney</text>
  <text x="346" y="249" fill="#374151" font-family="Inter, SF Pro Text, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600">Split expenses. Track balances. Settle clearly.</text>

  <g font-family="Inter, SF Pro Text, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="800">
    <rect x="346" y="294" width="108" height="36" rx="18" fill="#2563eb"/>
    <text x="400" y="319" fill="#ffffff" text-anchor="middle">Groups</text>
    <rect x="468" y="294" width="128" height="36" rx="18" fill="#059669"/>
    <text x="532" y="319" fill="#ffffff" text-anchor="middle">Balances</text>
    <rect x="610" y="294" width="150" height="36" rx="18" fill="#f97316"/>
    <text x="685" y="319" fill="#ffffff" text-anchor="middle">Settle up</text>
  </g>
</svg>
