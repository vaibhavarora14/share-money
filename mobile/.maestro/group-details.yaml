appId: com.vaibhavarora.sharemoney
---
# Test: Group Details
# This test verifies that a user can view group details after signing in
# Prerequisites: User must be signed in and have at least one group
# Note: App should be launched manually or already running before running this test

- runFlow: _helpers/ensure-groups.yaml

# Wait for groups to load
- waitForAnimationToEnd

# Tap on a group by name
- tapOn:
    text: "Summer Vacation 2024"

# Wait for group details screen to load
- waitForAnimationToEnd

# Verify group details screen elements are visible
# The screen now uses segmented buttons to switch between Transactions and Activity views
- assertVisible:
    text: "Transactions"
- assertVisible:
    text: "Activity"

# Test switching to Activity tab
- tapOn:
    text: "Activity"
- waitForAnimationToEnd

# Switch back to Transactions tab
- tapOn:
    text: "Transactions"
- waitForAnimationToEnd

# Test accessing People view via three-dot overflow menu (top right)
- tapOn:
    id: "group-menu-button"
    optional: true

# Wait for menu animation
- waitForAnimationToEnd

# Tap on "People" if the menu is open
- runFlow:
    when:
      visible: "People"
    commands:
      - tapOn:
          text: "People"
      - waitForAnimationToEnd

# Check if we're in people/members view - if so, navigate back to group details
- runFlow:
    when:
      visible: "People"
    commands:
      # People view is open - verify and navigate back
      - assertVisible:
          text: "Add person"
          optional: true
      - tapOn:
          text: "Navigate back"
      - waitForAnimationToEnd

# Navigate back to groups list
- tapOn:
    text: "Navigate back"

# Wait for navigation
- waitForAnimationToEnd

# Verify we're back on groups list
- assertVisible: "Your Groups"

# Go to group details again to test Android native back button
- waitForAnimationToEnd
- tapOn:
    text: "Summer Vacation 2024"

# Wait for group details screen to load
- waitForAnimationToEnd

# Verify we're on group details screen again by checking segmented buttons
- assertVisible:
    text: "Transactions"

# Test Android native back button
- pressKey: "Back"

# Wait for navigation
- waitForAnimationToEnd

# Verify we're back on groups list
- assertVisible: "Your Groups"
- runFlow: signout.yaml
