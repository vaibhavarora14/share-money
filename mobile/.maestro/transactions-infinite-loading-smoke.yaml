appId: com.sharemoney.app
---
# Test: Transactions Infinite Loading (Smoke)
# Purpose: Guard the infinite-loading UI path without relying on large fixture volume.

- runFlow: _helpers/ensure-groups.yaml

# Open seeded group
- tapOn: "Summer Vacation 2024"
- waitForAnimationToEnd
- assertVisible: "Add Expense"

# Exercise transaction list scrolling
- swipe:
    direction: UP
    duration: 700
- waitForAnimationToEnd

# If pagination affordance is visible, trigger it
- runFlow:
    when:
      visible: "Load more transactions"
    commands:
      - tapOn: "Load more transactions"
      - waitForAnimationToEnd

# Ensure list remains usable after scroll/load interaction
- assertVisible: "Add Expense"

# Verify an older seeded transaction can still be reached
- scrollUntilVisible:
    element:
      text: "Dinner at fancy restaurant"
    direction: DOWN
    timeout: 10000

# Navigate back and sign out
- pressKey: "Back"
- waitForAnimationToEnd
- assertVisible: "Your Groups"
- runFlow: signout.yaml
