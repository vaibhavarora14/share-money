appId: com.vaibhavarora.sharemoney
---
# Test: Transactions Infinite Loading (Smoke)
# Purpose: Guard the infinite-loading UI path without relying on large fixture volume.

- runFlow: _helpers/ensure-groups.yaml

# Open seeded group
- tapOn: "Summer Vacation 2024"
- waitForAnimationToEnd
- assertVisible: "Transactions"

# Exercise transaction list scrolling
- swipe:
    direction: UP
    duration: 700
- waitForAnimationToEnd

# If pagination affordance is visible, trigger it
- runFlow:
    when:
      visible: "Load more transactions"
    commands:
      - tapOn: "Load more transactions"
      - waitForAnimationToEnd

# Ensure list remains usable after scroll/load interaction
- assertVisible: "Transactions"
- assertVisible: "Activity"

# Capture dashboard spending labels before deeper pagination (values may vary by seed;
# the key regression is that My Spending / Group summary remain visible and unchanged
# after loading more list items — they must not be derived from the paginated list).
- scrollUntilVisible:
    element:
      text: "My Spending"
    direction: UP
    timeout: 10000
- assertVisible: "My Spending"
- assertVisible: "Group summary"

# Verify an older seeded transaction can still be reached
- scrollUntilVisible:
    element:
      text: "Car rental for the week"
    direction: DOWN
    timeout: 10000

# After reaching older list items, spending summary cards must still be present
# (stable backend stats — not recomputed from newly loaded pages).
- scrollUntilVisible:
    element:
      text: "My Spending"
    direction: UP
    timeout: 10000
- assertVisible: "My Spending"
- assertVisible: "Group summary"

# Navigate back and sign out
- tapOn: "Navigate back"
- waitForAnimationToEnd
- assertVisible: "Your Groups"
- runFlow: signout.yaml
