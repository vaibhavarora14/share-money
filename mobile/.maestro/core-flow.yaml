appId: com.sharemoney.app
---
# Core Smoke Flow: list -> details -> activity -> details -> list
# Covers: login bootstrap, group opening, segmented tabs, and top-level return path.

- runFlow: _helpers/ensure-groups.yaml
- tapOn: "Summer Vacation 2024"
- waitForAnimationToEnd
- assertVisible: "Transactions"
- assertVisible: "Activity"
- tapOn: "Activity"
- waitForAnimationToEnd
- tapOn: "Transactions"
- waitForAnimationToEnd
- pressKey: "Back"
- waitForAnimationToEnd
- assertVisible: "Your Groups"
- runFlow: signout.yaml
