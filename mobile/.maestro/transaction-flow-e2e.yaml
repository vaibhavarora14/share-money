appId: com.vaibhavarora.sharemoney
---
# Transaction E2E Smoke: open group -> add expense -> verify -> return
# Covers: create-transaction path and post-save list refresh on seeded data.

- runFlow: _helpers/ensure-groups.yaml
- tapOn: "Summer Vacation 2024"
- waitForAnimationToEnd
- tapOn: "Add Expense"
- waitForAnimationToEnd
- tapOn:
    id: "amount-input"
- inputText: "77"
- tapOn: "Description"
- inputText: "E2E Transaction Smoke"
- hideKeyboard
- tapOn: "Save"
- waitForAnimationToEnd
- assertVisible: "E2E Transaction Smoke"
- assertVisible: "₹77.00"
- pressKey: "Back"
- waitForAnimationToEnd
- assertVisible: "Your Groups"
- runFlow: signout.yaml
